<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cognitive State & Retention Visualizer</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 30px; background: #0f172a; color: #f8fafc; }
    .card { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    button { padding: 10px 18px; margin-right: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .btn-correct { background: #22c55e; color: #fff; }
    .btn-wrong { background: #ef4444; color: #fff; }
    .metric { font-size: 2rem; font-weight: bold; color: #38bdf8; }
    input[type=range] { width: 100%; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>Cognitive Retention Engine (BKT + Ebbinghaus)</h2>
  
  <div class="card">
    <button class="btn-correct" onclick="submitAttempt(true)">Simulate Correct Answer (+)</button>
    <button class="btn-wrong" onclick="submitAttempt(false)">Simulate Slip / Wrong (-)</button>
  </div>

  <div class="grid">
    <div class="card">
      <div>Mastery Probability P(L)</div>
      <div id="masteryVal" class="metric">0.100</div>
      <div style="margin-top:10px;">Stability: <span id="stabVal">60.0</span> min | Next Review: <span id="revVal">--</span> min</div>
    </div>
    <div class="card">
      <label>Time-Warp Slider: <b id="warpLabel">0 min</b></label>
      <input id="warpSlider" type="range" min="0" max="720" value="0" oninput="timeWarp(this.value)">
      <div style="margin-top: 15px;">Decayed Retrievability: <span id="decayedR" class="metric">1.000</span></div>
    </div>
  </div>

  <div class="card">
    <canvas id="decayChart" height="90"></canvas>
  </div>

  <script>
    let currentStability = 60.0;
    const ctx = document.getElementById('decayChart').getContext('2d');
    
    function generateCurveData(S) {
      const labels = [], data = [], thresh = [];
      for(let t = 0; t <= S * 2.5; t += Math.max(1, S / 20)) {
        labels.push(Math.round(t));
        data.push(Math.exp(-t / S));
        thresh.push(0.70);
      }
      return { labels, data, thresh };
    }

    const initial = generateCurveData(currentStability);
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: initial.labels,
        datasets: [
          { label: 'Retrievability R(t)', data: initial.data, borderColor: '#38bdf8', tension: 0.2 },
          { label: 'Review Threshold (0.70)', data: initial.thresh, borderColor: '#f43f5e', borderDash: [5, 5], pointRadius: 0 }
        ]
      },
      options: { scales: { y: { min: 0, max: 1.05 } } }
    });

    async function submitAttempt(isCorrect) {
      const res = await fetch('http://localhost:8000/api/attempt', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ user_id: 'tester', concept_id: 'bayes_101', is_correct: isCorrect })
      });
      const data = await res.json();
      document.getElementById('masteryVal').innerText = data.mastery_probability;
      document.getElementById('stabVal').innerText = data.memory_stability_minutes;
      document.getElementById('revVal').innerText = data.minutes_until_review;
      currentStability = data.memory_stability_minutes;
      
      document.getElementById('warpSlider').value = 0;
      document.getElementById('warpLabel').innerText = "0 min";
      document.getElementById('decayedR').innerText = "1.000";

      const updated = generateCurveData(currentStability);
      chart.data.labels = updated.labels;
      chart.data.datasets[0].data = updated.data;
      chart.data.datasets[1].data = updated.thresh;
      chart.update();
    }

    async function timeWarp(mins) {
      document.getElementById('warpLabel').innerText = `${mins} min`;
      const res = await fetch('http://localhost:8000/api/time-travel', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ user_id: 'tester', concept_id: 'bayes_101', minutes_forward: parseFloat(mins) })
      });
      const data = await res.json();
      document.getElementById('decayedR').innerText = data.current_retrievability;
    }
  </script>
</body>
</html>
